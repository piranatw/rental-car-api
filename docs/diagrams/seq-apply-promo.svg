<svg xmlns="http://www.w3.org/2000/svg" width="1805" height="879" viewBox="0 0 1805 879" font-family="Helvetica, Arial, sans-serif" font-size="17">
<rect width="1805" height="879" fill="white"/>
<defs><marker id="ah" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M0,0 L12,5 L0,10 z" fill="#374151"/></marker><marker id="ao" markerWidth="12" markerHeight="10" refX="11" refY="5" orient="auto"><path d="M1,1 L11,5 L1,9" fill="none" stroke="#374151" stroke-width="1.6"/></marker></defs>
<rect x="14" y="315" width="1777" height="464" rx="4" fill="none" stroke="#94A3B8" stroke-width="1.6"/>
<path d="M14,315 h46.5 v22 l-8,8 h-38.5 z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/><text x="23" y="335" font-weight="700" font-size="15">alt</text>
<text x="72.5" y="337" font-style="italic" fill="#334155">[reserve refused: expired, max redemptions or per-user limit]</text>
<line x1="14" y1="426" x2="1791" y2="426" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="26" y="448" font-style="italic" fill="#334155">[reserved]</text>
<rect x="26" y="561" width="1753" height="210" rx="4" fill="none" stroke="#94A3B8" stroke-width="1.6"/>
<path d="M26,561 h46.5 v22 l-8,8 h-38.5 z" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1.2"/><text x="35" y="581" font-weight="700" font-size="15">alt</text>
<text x="84.5" y="583" font-style="italic" fill="#334155">[booking edited meanwhile (3 tries)]</text>
<line x1="26" y1="693" x2="1779" y2="693" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="38" y="715" font-style="italic" fill="#334155">[finalised]</text>
<line x1="212.5" y1="90" x2="212.5" y2="865" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="87.5" y="24" width="250" height="66" rx="6" fill="#E5E7EB" stroke="#6B7280" stroke-width="2"/>
<text x="212.5" y="49" text-anchor="middle" font-style="italic" font-size="15">«client»</text>
<text x="212.5" y="71" text-anchor="middle" font-weight="700">Postman</text>
<line x1="557.5" y1="90" x2="557.5" y2="865" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="432.5" y="24" width="250" height="66" rx="6" fill="#DCE8F7" stroke="#5B7DB1" stroke-width="2"/>
<text x="557.5" y="49" text-anchor="middle" font-style="italic" font-size="15">«controllers»</text>
<text x="557.5" y="71" text-anchor="middle" font-weight="700">promos.js applyPromo</text>
<line x1="902.5" y1="90" x2="902.5" y2="865" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="777.5" y="24" width="250" height="66" rx="6" fill="#DDF1E4" stroke="#4F9A6A" stroke-width="2"/>
<text x="902.5" y="49" text-anchor="middle" font-style="italic" font-size="15">«model»</text>
<text x="902.5" y="71" text-anchor="middle" font-weight="700">Booking</text>
<line x1="1247.5" y1="90" x2="1247.5" y2="865" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="1122.5" y="24" width="250" height="66" rx="6" fill="#DDF1E4" stroke="#4F9A6A" stroke-width="2"/>
<text x="1247.5" y="49" text-anchor="middle" font-style="italic" font-size="15">«model»</text>
<text x="1247.5" y="71" text-anchor="middle" font-weight="700">PromoCode</text>
<line x1="1592.5" y1="90" x2="1592.5" y2="865" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 6"/>
<rect x="1467.5" y="24" width="250" height="66" rx="6" fill="#DDF1E4" stroke="#4F9A6A" stroke-width="2"/>
<text x="1592.5" y="49" text-anchor="middle" font-style="italic" font-size="15">«model»</text>
<text x="1592.5" y="71" text-anchor="middle" font-weight="700">PromoRedemption</text>
<path d="M1127.5,787 h571 l14,14 v44 h-585 z" fill="#FEF9C3" stroke="#CA8A04" stroke-width="1.3"/>
<text x="1137.5" y="809" fill="#422006">30 parallel applies with max 5: exactly 5 succeed. Check and</text>
<text x="1137.5" y="830" fill="#422006">increment are one atomic update.</text>
<line x1="216.5" y1="150" x2="555.5" y2="150" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="385" y="124" text-anchor="middle" fill="#1B2430">POST /api/v1/bookings/:id/promo {</text>
<text x="385" y="145" text-anchor="middle" fill="#1B2430">code } (protect passes)</text>
<line x1="561.5" y1="186" x2="900.5" y2="186" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="730" y="181" text-anchor="middle" fill="#1B2430">load booking, owner or admin only</text>
<line x1="561.5" y1="243" x2="900.5" y2="243" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="730" y="217" text-anchor="middle" fill="#0B6F63" font-weight="700">1. claim: set promo where promo is</text>
<text x="730" y="238" text-anchor="middle" fill="#0B6F63" font-weight="700">null (atomic)</text>
<line x1="561.5" y1="300" x2="1245.5" y2="300" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="902.5" y="274" text-anchor="middle" fill="#0B6F63" font-weight="700">2. reserve: ONE update, in date window and count &lt; max and user &lt; limit,</text>
<text x="902.5" y="295" text-anchor="middle" fill="#0B6F63" font-weight="700">then $inc both</text>
<line x1="561.5" y1="367" x2="900.5" y2="367" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="730" y="362" text-anchor="middle" fill="#0B6F63" font-weight="700">undo: release the claim</text>
<line x1="553.5" y1="403" x2="214.5" y2="403" stroke="#374151" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ao)"/>
<text x="385" y="398" text-anchor="middle" fill="#0B6F63" font-weight="700">400 reason</text>
<line x1="561.5" y1="468" x2="1590.5" y2="468" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="1075" y="463" text-anchor="middle" fill="#0B6F63" font-weight="700">3. create redemption for the booking owner</text>
<line x1="561.5" y1="546" x2="900.5" y2="546" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="730" y="499" text-anchor="middle" fill="#0B6F63" font-weight="700">4. finalise discount and</text>
<text x="730" y="520" text-anchor="middle" fill="#0B6F63" font-weight="700">totalPrice (pinned to priced</text>
<text x="730" y="541" text-anchor="middle" fill="#0B6F63" font-weight="700">dates)</text>
<line x1="561.5" y1="613" x2="1245.5" y2="613" stroke="#374151" stroke-width="1.8" marker-end="url(#ah)"/>
<text x="902.5" y="608" text-anchor="middle" fill="#0B6F63" font-weight="700">undo in reverse: delete redemption, $inc -1, release claim</text>
<line x1="553.5" y1="670" x2="214.5" y2="670" stroke="#374151" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ao)"/>
<text x="385" y="644" text-anchor="middle" fill="#0B6F63" font-weight="700">409 Booking was modified</text>
<text x="385" y="665" text-anchor="middle" fill="#0B6F63" font-weight="700">concurrently</text>
<line x1="553.5" y1="756" x2="214.5" y2="756" stroke="#374151" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#ao)"/>
<text x="385" y="730" text-anchor="middle" fill="#0B6F63" font-weight="700">200 booking with promo, discount,</text>
<text x="385" y="751" text-anchor="middle" fill="#0B6F63" font-weight="700">lower totalPrice</text>
</svg>